apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: '{{ .Values.name }}'
  namespace: '{{ .Values.namespace }}'
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.156.0/20
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.6.0
      namespace: vmware-system-vks-public
    version: '{{ .Values.vksVersion }}'
    variables:
      - name: vmClass
        value: best-effort-large
      - name: storageClass
        value: vsan-default-storage-policy
      - name: volumes
        value:
          - name: vol-jjrh-20
            mountPath: /var/lib/containerd
            storageClass: vsan-default-storage-policy
            capacity: 50Gi
    controlPlane:
      replicas: {{ .Values.controlPlaneReplicas }}
      metadata:
        annotations:
          run.tanzu.vmware.com/resolve-os-image: os-name=photon, content-library=cl-368c21b17d0ceedf4
    workers:
      machineDeployments:
        - class: node-pool
          name: '{{ .Values.name }}-np-3fp5'
          replicas: {{ .Values.nodePoolReplicas }}
          metadata:
            annotations:
              run.tanzu.vmware.com/resolve-os-image: os-name=photon, content-library=cl-368c21b17d0ceedf4
